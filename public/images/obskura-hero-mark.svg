  <style>
    .house-orbit {
      stroke-dasharray: 1;
      animation: draw 850ms cubic-bezier(.22,.61,.36,1) both;
    }
    .o1 { animation-delay: 70ms; }
    .o2 { animation-delay: 140ms; }
    .o3 { animation-delay: 210ms; }
    .house-node { animation: appear 420ms ease-out 550ms both; }
    .n1 { animation-delay: 640ms; }
    .n2 { animation-delay: 730ms; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .house-orbit, .house-node { animation: none; }
    }
  </style>
