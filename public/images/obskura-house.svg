<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-label="A house assembles in stages, finishing with a softly glowing Obskura logo centered on its facade"><style>.house-grid{opacity:0;animation:house-fade .8s ease forwards}.house-guides path{stroke-dasharray:1;stroke-dashoffset:1;animation:build-line 1.25s ease forwards}.house-guides path:nth-child(2){animation-delay:.15s}.house-guides path:nth-child(3){animation-delay:.3s}.house-walls{opacity:0;animation:build-wall .9s cubic-bezier(.2,.7,.3,1) .45s forwards}.house-roof{opacity:0;animation:build-roof .95s cubic-bezier(.2,.7,.3,1) 1s forwards}.house-chimney{opacity:0;animation:build-roof .65s ease 1.35s forwards}.house-details{opacity:0;animation:house-fade .65s ease 1.55s forwards}.house-points{opacity:0;animation:house-fade .6s ease 1.7s forwards}.house-connections path{stroke-dasharray:1;stroke-dashoffset:1;animation:build-line 1s ease 1.6s forwards}.logo-settle{opacity:0;transform-box:fill-box;transform-origin:center;animation:logo-land 1.7s cubic-bezier(.2,.7,.3,1) 2.15s forwards,logo-glow 2.4s ease 2.35s forwards}.house-brand .house-orbit{stroke-dasharray:1;stroke-dashoffset:1;animation:build-line 1.4s cubic-bezier(.2,.65,.25,1) 2.3s forwards}.house-brand .house-orbit.o1{animation-delay:2.42s}.house-brand .house-orbit.o2{animation-delay:2.54s}.house-brand .house-orbit.o3{animation-delay:2.66s}.house-brand .house-node{opacity:0;animation:house-fade .55s ease 3.15s forwards}.house-brand .house-node.n1{animation-delay:3.3s}.house-brand .house-node.n2{animation-delay:3.45s}@keyframes build-line{to{stroke-dashoffset:0}}@keyframes house-fade{to{opacity:1}}@keyframes build-wall{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes build-roof{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:translateY(0)}}@keyframes logo-land{from{opacity:0;transform:translateY(28px) scale(1.12)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes logo-glow{0%{filter:drop-shadow(0 0 0 #e63b2e00)}40%{filter:drop-shadow(0 0 26px #e63b2e55) drop-shadow(0 0 8px #f5f3eeaa)}100%{filter:drop-shadow(0 0 0 #e63b2e00)}}@media(prefers-reduced-motion:reduce){.house-grid,.house-walls,.house-roof,.house-chimney,.house-details,.house-points,.logo-settle,.house-brand .house-node{animation:none;opacity:1;transform:none;filter:none}.house-guides path,.house-connections path,.house-brand .house-orbit{animation:none;stroke-dashoffset:0}}
.house-guides path{stroke-linecap:round;stroke-linejoin:round;animation:soft-line 1.25s linear both}.house-guides path:nth-child(2){animation-delay:.15s}.house-guides path:nth-child(3){animation-delay:.3s}.house-connections path{stroke-linecap:round;stroke-linejoin:round;animation:soft-line 1s linear 1.6s both}.logo-settle{animation:logo-land 1.7s cubic-bezier(.16,1,.3,1) 2.15s forwards,logo-glow 2.4s ease 2.35s forwards}.house-brand .house-orbit{animation:soft-line 1.4s linear 2.3s both}.house-brand .house-orbit.o1{animation-delay:2.42s}.house-brand .house-orbit.o2{animation-delay:2.54s}.house-brand .house-orbit.o3{animation-delay:2.66s}.house-brand .house-node{animation:house-fade .55s ease 3.15s forwards}.house-brand .house-node.n1{animation-delay:3.3s}.house-brand .house-node.n2{animation-delay:3.45s}@keyframes soft-line{0%{stroke-dashoffset:1;opacity:0}10%{stroke-dashoffset:.78;opacity:.8}35%{stroke-dashoffset:.25;opacity:1}60%{stroke-dashoffset:.065;opacity:1}80%{stroke-dashoffset:.012;opacity:1}93%{stroke-dashoffset:.0015;opacity:1}100%{stroke-dashoffset:0;opacity:1}}@media(prefers-reduced-motion:reduce){.house-guides path,.house-connections path,.house-brand .house-orbit{animation:none;stroke-dashoffset:0;opacity:1}.logo-settle,.house-brand .house-node{animation:none;opacity:1;transform:none;filter:none}}</style><rect width="560" height="500" fill="#e8e4dd"/><defs><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#111111" stroke-opacity=".12"/></pattern></defs><rect class="house-grid" width="560" height="500" fill="url(#grid)"/><g class="house-guides" fill="none" stroke="#111111" stroke-width="1" opacity=".45"><path pathLength="1" d="M45 365 280 225 515 365 280 500Z"/><path pathLength="1" d="M45 315 280 175 515 315 280 455Z" stroke-opacity=".3"/><path pathLength="1" d="M45 265 280 125 515 265 280 405Z" stroke-opacity=".3"/></g><g class="house-walls"><path d="M140 270 280 190 420 270 420 365 280 4